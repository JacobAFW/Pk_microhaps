# config.yaml — all parameters and paths for the Pk microhap discovery pipeline.
# Override individual values with: snakemake --config key=value

# ---------------------------------------------------------------------------
# Inputs (populated by envs/install.sh; symlinked from Pop-gen by default)
# ---------------------------------------------------------------------------
vcf:
  # Discovery cohort VCF. 990-sample Indonesia + Malaysia merged Pk WGS.
  path: data/vcf/merged_popgen.vcf.gz
  # Tabix/CSI index — required for region queries.
  index: data/vcf/merged_popgen.vcf.gz.csi

reference:
  # PlasmoDB-67 PknowlesiA1H1 fasta (matches Pop-gen).
  fasta: data/reference/PlasmoDB-67_PknowlesiA1H1_Genome.fasta
  # PlasmoDB-68 GFF for coding-region annotation.
  gff: data/reference/PlasmoDB-68_PknowlesiA1H1.gff
  # The same annotation lifted onto strain_A1 (ordered_PKNH_*_v2) coordinates by
  # HANDOFF #02's liftoff run — i.e. the only GFF whose contig names match the
  # VCF. Built out-of-band, not by a rule, so it is an external input like the
  # mask list. Used for gene-level annotation of candidate windows (Stage 04)
  # and by scripts/py/audit_core_coding_bed.py.
  gff_lifted: data/reference/pk_annotation.lifted.gff
  # Region exclusion list from Pop-gen (309 problematic regions, colon-dash format).
  mask_list: data/reference/regions_to_mask.list

# Pre-computed Fws table from Pop-gen Stage 2. Used by 02_sample_qc.smk to
# identify likely-monoclonal samples (Siegel framework requires Fws ≥ 0.95).
# The path is relative to POPGEN_PIPELINE_PATH if set, or the default sibling
# location. Stage 02 will assert the file exists; if not, falls back to
# computing Fws in-project via moimix.
popgen:
  fws_table: outputs/setup/fws_from_popgen.tsv  # populated by 01_data_prep

# ---------------------------------------------------------------------------
# Stage 02 — sample QC (Siegel notebook 1, phase 1)
# ---------------------------------------------------------------------------
sample_qc:
  fws_threshold: 0.95            # monoclonal proxy
  callable_threshold: 0.50       # ≥50% core genome callable

# ---------------------------------------------------------------------------
# Stage 02b — duplicates, IBD, clonal thinning
#
# Key names are deliberately identical to the `agnostic` pop-gen pipeline's
# `clonality:` / `ibd:` blocks — same idiom in both repos beats a locally
# neater design. Keys below the first group are Microhaplotype-specific.
# ---------------------------------------------------------------------------
clonality:
  declonalize: false             # L3; true = thin to one representative per clonal group
  clonal_ibd_threshold: 0.95     # Siegel's clone threshold; matches agnostic's ibd.clonal_ibd_threshold
  min_cluster_n: 5               # skip hmmIBD below this
  duplicate_id_pattern: "_DK.*"  # Illumina lane suffix on the Indo VCF
  ibd_min_maf: 0.01              # L1
  ibd_max_variant_missing: 0.20  # L1 — the relaxed knob. Run A = 0.10, Run B = 0.20.
  ibd_ld_prune: false            # L1 — MUST stay false. hmmIBD models IBD along the
                                 # chromosome and needs linkage structure. LD-pruning
                                 # is an ADMIXTURE requirement, not an IBD one.

  # --- Microhaplotype-specific -------------------------------------------
  ibd_min_variants: 20000        # rule ibd_variant_set asserts at least this many
  cluster_table: data/metadata/admix_clusters.tsv   # L2, vendored from agnostic
  residual_cluster_name: "RESIDUAL"
  # L2: samples with no imported cluster label form a residual group. It is
  # REPORTED but never clonal-called — a residual group is not a genetically
  # homogeneous population, so hmmIBD on it would manufacture the very
  # population-structure artefact L2 exists to prevent.
  residual_clonal_calls: false
  focal_cluster: "Peninsular"    # extra pair-file; the Aceh result under most scrutiny
  # Non-nuclear contigs. Excluded from IBD: organellar genomes are uniparentally
  # inherited and break hmmIBD's along-chromosome segment model.
  exclude_contigs: ["PKNH_MIT_v2", "new_API_strain_A1_H.1"]
  # .fai whose contig names match the VCF (ordered_PKNH_*_v2). NOT the
  # PlasmoDB-67 .fai, which carries LT* accessions instead.
  contig_fai: data/reference/strain_preDB_version/strain_A1_H.1.Icor.fasta.fai

# ---------------------------------------------------------------------------
# Stage 03 — SNP QC (Siegel notebook 1, phase 2)
# ---------------------------------------------------------------------------
snp_qc:
  maf_min: 0.10                  # global MAF floor
  missingness_max: 0.10          # per-SNP genotype failure rate
  require_pass: true             # FILTER == PASS only
  biallelic_only: true
  restrict_to_core_coding: true  # uses 01_data_prep's pk_core_coding.bed

# ---------------------------------------------------------------------------
# Stage 04 — window scan (Siegel notebook 1, phase 3)
# ---------------------------------------------------------------------------
window_scan:
  size_bp: 200                   # max Illumina amplicon size
  step_bp: 50                    # 75% overlap
  min_snps: 3                    # ≥3 SNPs per candidate window
  min_heterozygosity: 0.50       # window He floor (above max for biallelic SNP)
  seed: 250523                   # L2 — Siegel's haploidify seed, so any
                                 # comparison to the paper is exact. Applied to
                                 # the het_nomiss branch ONLY; het_raw is
                                 # computed on un-haploidified diploid columns.
  missing_policy: both           # L1 — emit het_raw (Siegel-faithful) AND
                                 # het_nomiss; filter the heterozygome on
                                 # het_raw only. Recorded in the summary.
  # Output versioning. Results land in outputs/scan/<version_tag>/ and figures in
  # reports/figures/<figures_subdir>/. Bump version_tag for a re-run — the scan
  # script refuses to start if its outputs already exist, so nothing is
  # overwritten and old versions stay where they are.
  version_tag: v1_2026-09-25
  figures_subdir: 04_window_scan

# ---------------------------------------------------------------------------
# Stage 05 — panel selection (Siegel notebook 2)
# ---------------------------------------------------------------------------
panel_select:
  snp_min_per_window: 3          # tighter than scan for selection
  snp_max_per_window: 10         # diminishing returns above 10; 2^10 = 1024 combos
  heterozygosity_min: 0.60       # higher floor for selection
  panel_sizes: [50, 100, 150, 200, 250]
  algorithms: [greedy, evenly_spaced]
  default_panel_size: 100        # the v1 deliverable
  # Minimum distance between selected markers. Load-bearing, not cosmetic:
  # Stage 04 windows are 200 bp at a 50 bp step, so neighbouring candidates
  # overlap by up to 75% and describe the same piece of genome. On the Stage 04
  # output, 19,674 selection-eligible windows collapse to 5,915 independent
  # loci. Without this, a panel could spend several markers on one locus and
  # report them as independent. 10 kb is a starting value, not a locked
  # decision — it has never been run.
  min_spacing_bp: 10000
  # Output versioning, same convention as window_scan. Bump for a re-run; the
  # script refuses to start if its outputs already exist.
  version_tag: v1_2026-09-25

# ---------------------------------------------------------------------------
# Stage 06 — validation (Siegel notebook 2 + paper Methods)
# ---------------------------------------------------------------------------
validation:
  paneljudge:
    r_grid: [0.0, 0.25, 0.5, 0.75, 1.0]
    n_simulations: 100           # haploid genotype pairs per r
    crossover_rate_per_bp: 7.4e-7  # paneljudge default (Taylor et al)
  hmmibd:
    version: "3.0"
    run_as_biallelic: true       # v3 limitation per Siegel methods
  ibd_thresholds:                # for classification reporting
    clone: 0.95
    close_relative: 0.25
    distant_relative: 0.05

# ---------------------------------------------------------------------------
# Output layout
# ---------------------------------------------------------------------------
outputs:
  setup_dir: outputs/setup
  qc_dir: outputs/qc
  scan_dir: outputs/scan
  panel_dir: outputs/panel
  validation_dir: outputs/validation
  figures_dir: reports/figures
  logs_dir: logs
